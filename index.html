<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1f22" />
  <meta name="description" content="Orbit — a place to talk, share, and build communities." />
  <title>Orbit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/orbit-shell.css" />
  <link rel="stylesheet" href="/src/orbit-messages.css" />
  <link rel="stylesheet" href="/src/orbit-discover.css" />
  <link rel="stylesheet" href="/src/orbit-server-home.css" />
  <link rel="stylesheet" href="/src/orbit-inbox.css" />
  <link rel="stylesheet" href="/src/orbit-moderation.css" />
  <link rel="stylesheet" href="/src/orbit-insights.css" />
  <link rel="stylesheet" href="/src/orbit-forum.css" />
  <link rel="stylesheet" href="/src/orbit-templates.css" />
  <link rel="stylesheet" href="/src/orbit-automod.css" />
  <link rel="stylesheet" href="/src/orbit-audit-log.css" />
</head>
<body>
  <div id="orbit-app" class="orbit-app">
    <aside class="server-rail" aria-label="Servers">
      <button class="orbit-mark" aria-label="Orbit home">O</button>
      <div class="rail-divider"></div>
      <div id="server-list" class="server-list"></div>
      <button class="server-add" aria-label="Add a server">+</button>
      <div class="rail-bottom"><button aria-label="Explore">⌕</button><button aria-label="Settings">⚙</button></div>
    </aside>
    <aside id="side-panel" class="side-panel">
      <header class="side-header"><button id="workspace-menu" class="workspace-menu">Orbit <span>⌄</span></button><button id="mobile-close" class="mobile-close" aria-label="Close navigation">×</button></header>
      <div class="side-scroll">
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item" data-view="Friends"><span>♧</span> Friends <i class="nav-count">2</i></button>
          <button class="nav-item" data-view="Nitro"><span>✧</span> Discover</button>
          <button class="nav-item" data-view="Shop"><span>▣</span> Shop</button>
          <button class="nav-item" data-view="Activity"><span>◉</span> Activity & Status</button>
        </nav>
        <section class="side-section">
          <div class="section-label"><span>DIRECT MESSAGES</span><button aria-label="New message">＋</button></div>
          <div id="dm-list" class="list-stack"></div>
        </section>
        <section class="side-section">
          <div class="section-label"><span>TEXT CHANNELS</span><button aria-label="Add channel">＋</button></div>
          <div id="channel-list" class="list-stack"></div>
        </section>
        <section class="side-section voice-section">
          <div class="section-label"><span>VOICE CHANNELS</span><button aria-label="Add voice channel">＋</button></div>
          <div class="channel-static">◖ Lounge</div>
        </section>
      </div>
      <footer class="user-dock">
        <button class="dock-profile" id="dock-profile"><span class="avatar avatar-me">A<i class="online-dot"></i></span><span class="dock-user"><b>Aevryn</b><small>Online</small></span></button>
        <div class="dock-actions"><button aria-label="Mute microphone">♩</button><button aria-label="Deafen">◖</button><button aria-label="User settings">⚙</button></div>
      </footer>
    </aside>
    <main class="main-panel">
      <header class="main-header">
        <div class="header-leading"><button id="mobile-open" class="mobile-open" aria-label="Open navigation">☰</button><span id="header-symbol">#</span><strong id="header-title">general</strong><span class="header-topic" id="header-topic">A place for everything and anything.</span></div>
        <div class="header-tools"><button aria-label="Threads">▤</button><button aria-label="Notifications">♧</button><button aria-label="Pinned messages">⌑</button><label class="search-box"><span>⌕</span><input placeholder="Search" /></label><button aria-label="Inbox">▣</button><button aria-label="Help">?</button></div>
      </header>
      <div class="chat-layout">
        <section class="chat-column">
          <div id="chat-scroll" class="chat-scroll">
            <div class="channel-welcome"><div class="welcome-hash">#</div><h1>Welcome to #general!</h1><p>This is the beginning of the #general channel.</p></div>
            <div id="messages" class="messages"></div>
          </div>
          <form id="composer" class="composer"><button type="button" aria-label="Add attachment">＋</button><input id="message-input" autocomplete="off" placeholder="Message #general" /><button type="button" aria-label="Gift">▱</button><button type="button" aria-label="GIF">GIF</button><button type="button" aria-label="Emoji">☺</button></form>
        </section>
        <aside class="member-panel"><div class="member-heading">ONLINE — 4</div><div id="member-list"></div><div class="member-heading offline-heading">OFFLINE — 2</div><div class="member-row dim"><span class="avatar avatar-mika">M</span><span>Mika</span></div><div class="member-row dim"><span class="avatar avatar-jules">J</span><span>Jules</span></div></aside>
      </div>
      <nav class="mobile-bottom-nav"><button>⌂<small>Home</small></button><button>♧<small>Friends</small></button><button>▤<small>Messages</small></button><button>☷<small>Servers</small></button></nav>
    </main>
  </div>
  <div id="mobile-backdrop" class="mobile-backdrop"></div>
  <script type="module" src="/src/orbit-shell.js"></script>
  <script type="module" src="/src/orbit-messages.js"></script>
  <script type="module" src="/src/orbit-discover.js"></script>
  <script type="module" src="/src/orbit-server-home.js"></script>
  <script type="module" src="/src/orbit-inbox.js"></script>
  <script type="module" src="/src/orbit-moderation.js"></script>
  <script type="module" src="/src/orbit-settings.js"></script>
  <script type="module" src="/src/orbit-search.js"></script>
  <script type="module" src="/src/orbit-threads.js"></script>
  <script type="module" src="/src/orbit-saved.js"></script>
  <script type="module" src="/src/orbit-invites.js"></script>
  <script type="module" src="/src/orbit-activity.js"></script>
  <script type="module" src="/src/orbit-onboarding.js"></script>
  <script type="module" src="/src/orbit-insights.js"></script>
  <script type="module" src="/src/orbit-forum.js"></script>
  <script type="module" src="/src/orbit-templates.js"></script>
  <script type="module" src="/src/orbit-automod.js"></script>
  <script type="module" src="/src/orbit-audit-log.js"></script>
</body>
</html>
